name: Client Coverage Report
run-name: coverage-${{ inputs.job_id }}-${{ inputs.action }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Persistent coverage job id"
        required: true
        type: string
      action:
        description: "Coverage stage"
        required: true
        default: discover
        type: choice
        options:
          - discover
          - verify
          - country
          - finalize
      search_queries:
        description: "Queries for this discovery pass, separated by ||"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: coverage-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-coverage.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-coverage.txt

      - name: Run coverage stage
        env:
          COVERAGE_JOB_ID: ${{ inputs.job_id }}
          COVERAGE_ACTION: ${{ inputs.action }}
          COVERAGE_SEARCH_QUERIES: ${{ inputs.search_queries }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          ZENROWS_API_KEY: ${{ inputs.action == 'finalize' && secrets.ZENROWS_API_KEY || '' }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python -u backend/run_client_coverage_report.py

      - name: Upload stage result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.job_id }}-${{ inputs.action }}
          path: output/client_coverage_artifact/
          if-no-files-found: warn
          retention-days: 90
